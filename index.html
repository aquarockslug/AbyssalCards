<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AbyssalCards</title>
    <link rel="stylesheet" href="css/modern-normalize.css">
    <link rel="stylesheet" href="css/system.css">
    <link rel="stylesheet" href="css/microtip.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/lib/vivus.js"></script>
    <script src="js/lib/localforage.js"></script>
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <div id="game-ui">
      <header class="title-bar">
        <button type="button" class="close hidden"><span>Close</span></button>
        <span class="title">Abyssal Cards</span>
        <button type="button" class="resize hidden"><span>Resize</span></button>
      </header>

      <div id="controls">
        <div id="resources">
          <div class="resource" id="mana-display" role="tooltip" aria-label="Mana is generated naturally over time" data-microtip-position="bottom">
            <span class="resource-label">Mana</span>
            <span class="resource-value" id="mana">0.00</span>
          </div>
          <div class="resource" id="energy-display" role="tooltip" aria-label="Red cards transmute mana into energy" data-microtip-position="bottom">
            <span class="resource-label">Energy</span>
            <span class="resource-value" id="energy">0.00</span>
          </div>
          <div class="resource" id="control-display" role="tooltip" aria-label="Black cards transmute mana into control" data-microtip-position="bottom">
            <span class="resource-label">Control</span>
            <span class="resource-value" id="control">0.00</span>
          </div>
        </div>
      </div>

      <div id="main-layout">
        <aside class="window" id="left-panel">
          <header class="title-bar">
            <button type="button" class="close hidden"><span>Close</span></button>
            <span class="title">Spells</span>
          </header>
          <div class="window-pane">
            <span class="btn-group-label">Cards</span>
	    <div class="btn-group" role="tooltip" aria-label="The cost of drawing a card increases with the number of cards in your hand" data-microtip-position="bottom" data-microtip-size="fit">
              <button type="button" class="btn" id="buy-card" onclick="buyCard('ace')"></button>
              <button type="button" class="btn" id="destroy-card" onclick="removeSelectedCard()">Destroy Card</button>
            </div>

            <span class="btn-group-label modify-btn">Modify Rank <span class="modify-cost"></span></span>
            <div class="btn-group" role="tooltip" aria-label="Use control to make a card more or less powerful" data-microtip-position="bottom" data-microtip-size="fit">
              <button type="button" class="btn modify-btn" onclick="shiftRank(-1)">-</button>
              <button type="button" class="btn modify-btn" onclick="shiftRank(1)">+</button>
            </div>
            <span class="btn-group-label modify-btn">Modify Suite <span class="modify-cost"></span></span>
            <div class="btn-group" role="tooltip" aria-label="Use control to modify a cards innate abilities" data-microtip-position="bottom" data-microtip-size="fit">
              <button type="button" class="btn modify-btn" onclick="modifySelectedCard({suite:'hearts'})">♥</button>
              <button type="button" class="btn modify-btn" onclick="modifySelectedCard({suite:'spades'})">♠</button>
              <button type="button" class="btn modify-btn" onclick="modifySelectedCard({suite:'diamonds'})">♦</button>
              <button type="button" class="btn modify-btn" onclick="modifySelectedCard({suite:'clubs'})">♣</button>
            </div>
            <span class="btn-group-label modify-btn">Combine <span class="modify-cost"></span></span>
            <div class="btn-group" role="tooltip" aria-label="Combine the two selected cards" data-microtip-position="bottom" data-microtip-size="fit">
              <button type="button" class="btn modify-btn" onclick="console.log('shrink and move the active card into this button')"></button>
              <button type="button" class="btn modify-btn" onclick="console.log('shrink and move the active card into this button')"></button>
            </div>
          </div>
        </aside>

        <aside class="window" id="gains-window">
          <header class="title-bar">
            <button type="button" class="close hidden"><span>Close</span></button>
            <span class="title">Gains</span>
            <button type="button" class="minimize" aria-label="Minimize"><span>Minimize</span></button>
          </header>
          <div class="window-pane">
            <dl class="stat-list">
              <div class="stat"><dt>Mana</dt><dd id="mana-rate">0.00/s</dd></div>
              <div class="stat"><dt>Energy</dt><dd id="energy-rate">0.00/s</dd></div>
              <div class="stat"><dt>Control</dt><dd id="control-rate">0.00/s</dd></div>
              <div class="stat"><dt>Cards</dt><dd id="card-stats">0</dd></div>
            </dl>
          </div>
        </aside>

        <aside class="window" id="upgrades-window">
          <header class="title-bar">
            <button type="button" class="close hidden"><span>Close</span></button>
            <span class="title">Upgrades</span>
            <button type="button" class="minimize" aria-label="Minimize"><span>Minimize</span></button>
          </header>
          <div class="window-pane" id="upgrades"></div>
        </aside>

        <aside class="window" id="save-window">
          <header class="title-bar">
            <button type="button" class="close hidden"><span>Close</span></button>
            <span class="title">Save</span>
            <button type="button" class="minimize" aria-label="Minimize"><span>Minimize</span></button>
          </header>
          <div class="window-pane">
            <div class="btn-group">
              <button type="button" class="btn" onclick="saveGame()">Save</button>
              <button type="button" class="btn" onclick="resetGame()">Reset</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <div id="hand"></div>
  </body>
</html>
